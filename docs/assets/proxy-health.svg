<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc">
  <title id="title">Proxy health endpoint terminal capture</title>
  <desc id="desc">Terminal-style capture showing the Zen proxy starting and the health endpoint returning JSON.</desc>
  <rect width="1180" height="430" fill="#101418"/>
  <rect x="26" y="24" width="1128" height="382" rx="8" fill="#151a20" stroke="#2b343d"/>
  <circle cx="58" cy="54" r="7" fill="#ff5f57"/>
  <circle cx="82" cy="54" r="7" fill="#ffbd2e"/>
  <circle cx="106" cy="54" r="7" fill="#28c840"/>
  <text x="138" y="60" fill="#8f98a3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15">proxy-health</text>
  <text x="52" y="104" fill="#7dd3fc" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ PORT=4040 PROXY_API_KEY=local-test-key npm start</text>
  <text x="52" y="144" fill="#d6deeb" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">&gt; claude-code-zen-proxy@0.1.0 start</text>
  <text x="52" y="174" fill="#d6deeb" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">&gt; node src/server.js</text>
  <text x="52" y="224" fill="#a7f3d0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">{ "event": "proxy_listening", "host": "127.0.0.1", "port": 4040,</text>
  <text x="52" y="254" fill="#a7f3d0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">  "anthropic_model_alias": "claude-code-proxy",</text>
  <text x="52" y="284" fill="#a7f3d0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">  "upstream_model": "deepseek-v4-flash-free", "proxy_api_key": "configured" }</text>
  <text x="52" y="334" fill="#7dd3fc" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ curl -s http://127.0.0.1:4040/health</text>
  <text x="52" y="374" fill="#fef3c7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">{ "ok": true, "upstream_model": "deepseek-v4-flash-free",</text>
  <text x="52" y="404" fill="#fef3c7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">  "upstream_url": "https://opencode.ai/zen/v1/chat/completions" }</text>
</svg>
